<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>E-Ticket Mobile — Simple Travel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="js/vendor/lz-string.min.js"></script>
  <script src="js/vendor/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --sp: #F5A623;
      --sp-dark: #D4891A;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --bg-card: #FFFFFF;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #F4F6F8;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 90px;
    }
    /* Mobile Card Shell */
    .mobile-shell {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }
    /* The Ticket Card */
    .ticket-card {
      width: 100%;
      background: var(--bg-card);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      position: relative;
    }
    /* Header Brand */
    .ticket-header {
      padding: 20px 20px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #F1F5F9;
      background: #FFFFFF;
    }
    .ticket-logo {
      height: 38px;
      max-width: 140px;
      object-fit: contain;
    }
    .airline-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 5px 12px;
    }
    .airline-badge span {
      font-size: 11.5px;
      font-weight: 700;
      color: #334155;
    }
    /* PNR Highlight */
    .pnr-banner {
      margin: 10px 16px 6px;
      background: transparent;
      border: none;
      padding: 6px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .pnr-left .pnr-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #0F172A;
    }
    .pnr-left .pnr-code {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--sp);
      margin-top: 2px;
      line-height: 1.1;
    }
    .pnr-badge-tag {
      background: var(--flight-header-bg, var(--sp));
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    /* Flight Cards */
    .flight-card {
      margin: 12px 16px;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      overflow: hidden;
      background: #FFFFFF;
    }
    .flight-card__header {
      background: var(--flight-header-bg, var(--sp));
      color: #FFFFFF;
      padding: 8px 14px;
      font-size: 13.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      letter-spacing: 0.3px;
    }
    .flight-card__meta {
      padding: 9px 14px;
      background: #F8FAFC;
      border-bottom: 1px dashed #E2E8F0;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 11px;
      color: #475569;
    }
    .flight-card__meta .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .flight-card__meta .baggage-row {
      padding-top: 4px;
      border-top: 1px dotted #E2E8F0;
      color: #334155;
    }
    .flight-card__meta strong {
      color: #0F172A;
    }
    .flight-route-grid {
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      gap: 10px;
    }
    .route-node {
      display: flex;
      flex-direction: column;
    }
    .route-node.origin { text-align: left; }
    .route-node.dest { text-align: right; }
    .route-date {
      font-size: 11px;
      font-weight: 400;
      color: #000000;
      margin-bottom: 2px;
      line-height: 1.35;
    }
    .route-time {
      font-size: 22px;
      font-weight: 800;
      color: #0F172A;
      line-height: 1.1;
    }
    .route-code {
      font-size: 22px;
      font-weight: 800;
      color: var(--sp-dark);
      line-height: 1.15;
      margin: 2px 0;
    }
    .route-city {
      font-size: 11px;
      font-weight: 400;
      color: #000000;
      margin-top: 3px;
      line-height: 1.35;
    }
    .route-airport {
      font-size: 11px;
      font-weight: 400;
      color: #000000;
      margin-top: 2px;
      line-height: 1.35;
    }
    .route-terminal {
      font-size: 11px;
      font-weight: 400;
      color: #000000;
      margin-top: 2px;
      line-height: 1.35;
    }
    .route-mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      margin-top: 22px;
    }
    .route-plane-icon {
      color: var(--sp);
      font-size: 18px;
    }
    .route-dur {
      font-size: 10px;
      color: #94A3B8;
      font-weight: 600;
      margin-top: 4px;
      white-space: nowrap;
    }
    /* Passengers Card */
    .passenger-card {
      margin: 12px 16px;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      overflow: hidden;
      background: #FFFFFF;
    }
    .passenger-card__header {
      background: #F1F5F9;
      color: #334155;
      padding: 8px 14px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #E2E8F0;
    }
    .passenger-item {
      padding: 12px 14px;
      border-bottom: 1px solid #F1F5F9;
    }
    .passenger-item:last-child {
      border-bottom: none;
    }
    .passenger-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .passenger-name {
      font-size: 13.5px;
      font-weight: 800;
      color: #0F172A;
      text-transform: uppercase;
    }
    .passenger-tag {
      font-size: 11px;
      color: #000000;
      font-weight: 400;
    }
    .passenger-sub {
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #000000;
      font-weight: 400;
    }
    .passenger-ticket-no {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
      color: #000000;
    }
    .passenger-service-row {
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #000000;
      font-weight: 400;
      gap: 8px;
    }
    .passenger-service-desc {
      color: #000000;
      font-weight: 400;
      text-align: right;
    }
    .passenger-service-desc strong {
      color: #000000;
      font-weight: 400;
    }
    .passenger-service-desc .service-route {
      color: #000000;
      font-weight: 400;
      margin-left: 3px;
    }
    /* QR Section on Card */
    .qr-section {
      margin: 14px 16px;
      background: #F8FAFC;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1px dashed #CBD5E1;
    }
    .qr-canvas-box {
      width: 76px;
      height: 76px;
      background: #FFFFFF;
      border-radius: 8px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .qr-canvas-box img, .qr-canvas-box canvas {
      width: 68px !important;
      height: 68px !important;
    }
    .qr-info {
      flex: 1;
    }
    .qr-title {
      font-size: 12px;
      font-weight: 700;
      color: #0F172A;
    }
    .qr-desc {
      font-size: 10.5px;
      color: #64748B;
      margin-top: 2px;
      line-height: 1.4;
    }
    /* Footer */
    .ticket-footer {
      padding: 12px 16px 18px;
      text-align: center;
      background: #FFFFFF;
      border-top: 1px solid #F1F5F9;
    }
    .ticket-footer .hotline {
      font-size: 11px;
      font-weight: 600;
      color: #0F172A;
    }
    .ticket-footer .wish {
      font-size: 10.5px;
      color: var(--sp-dark);
      font-weight: 600;
      margin-top: 4px;
    }
    /* Bottom Floating Action Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      justify-content: center;
      z-index: 1000;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    /* When embedded in generator preview iframe, hide action buttons and banner */
    body.in-preview .bottom-bar,
    body.in-preview .zalo-notice-banner {
      display: none !important;
    }
    body.in-preview {
      background: #FFFFFF !important;
      padding: 0 !important;
    }
    body.in-preview .mobile-shell {
      max-width: 100% !important;
      margin: 0 !important;
    }
    body.in-preview .ticket-card {
      border-radius: 0 !important;
      box-shadow: none !important;
      border: none !important;
    }
    .btn-action {
      flex: 1;
      max-width: 210px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-save-img {
      background: linear-gradient(135deg, var(--sp) 0%, var(--sp-dark) 100%);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(245, 166, 35, 0.4);
    }
    .btn-save-img:active {
      transform: scale(0.97);
    }
    .btn-copy-info {
      background: rgba(255,255,255,0.12);
      color: #FFFFFF;
    }
    .btn-copy-info:active {
      transform: scale(0.97);
    }
    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      color: #FFFFFF;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      z-index: 10000;
      display: none;
      text-align: center;
      max-width: 90vw;
    }
    /* Zalo Notification Banner (Situates directly above ticket info) */
    .zalo-notice-banner {
      width: 100%;
      background: #1E293B;
      border: 1.5px solid var(--sp);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: none;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      transition: all 0.3s ease;
    }
    .zalo-notice-banner.banner-pulse {
      transform: scale(1.02);
      box-shadow: 0 0 20px var(--sp);
    }
    .zalo-notice-icon {
      font-size: 22px;
      line-height: 1;
      flex-shrink: 0;
    }
    .zalo-notice-body {
      flex: 1;
    }
    .zalo-notice-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--sp);
      margin-bottom: 2px;
    }
    .zalo-notice-text {
      font-size: 12.5px;
      color: #E2E8F0;
      line-height: 1.45;
    }
    .zalo-notice-text strong {
      color: #FFFFFF;
    }
    .btn-banner-copy-link {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
      padding: 8px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .btn-banner-copy-link:active {
      transform: scale(0.95);
      background: #10B981;
    }
    @keyframes etkt-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="mobile-shell">
    <!-- Zalo Notification Banner (situated right above ticket info) -->
    <div id="zalo-notice-banner" class="zalo-notice-banner">
      <div class="zalo-notice-icon">💡</div>
      <div class="zalo-notice-body">
        <div class="zalo-notice-title">Mở bằng trình duyệt máy để tải ảnh vé</div>
        <div class="zalo-notice-text">
          Bấm nút <strong>「Mở trình duyệt」</strong> bên dưới, hoặc bấm <strong>[ ••• ]</strong> ở góc trên Zalo ➔ Chọn <strong>"Mở bằng trình duyệt"</strong>
        </div>
      </div>
    </div>

    <!-- Card to capture -->
    <div id="ticket-card" class="ticket-card">
      <!-- Header -->
      <div class="ticket-header">
        <img class="ticket-logo" id="ticket-logo" src="" alt="Simple Travel">
        <div class="airline-badge" id="airline-badge">
          <span id="airline-name">VIETJET AIR</span>
        </div>
      </div>

      <!-- PNR Banner -->
      <div class="pnr-banner">
        <div class="pnr-left">
          <div class="pnr-label">MÃ ĐẶT CHỖ</div>
          <div class="pnr-code" id="pnr-code">SAQ68D</div>
        </div>
        <div class="pnr-badge-tag">Vé điện tử</div>
      </div>

      <!-- Flights Container -->
      <div id="flights-container"></div>

      <!-- Passengers Container -->
      <div id="passengers-container"></div>

      <!-- Footer -->
      <div class="ticket-footer">
        <div class="hotline" id="hotline-text">📞 Hotline: 0768.188.224 • booking@thesimple.media</div>
        <div class="wish">✨ Chúc Quý khách có chuyến bay an toàn & thuận lợi ✨</div>
      </div>
    </div>
  </div>

  <!-- Bottom Floating Bar -->
  <div class="bottom-bar">
    <button class="btn-action btn-save-img" id="btn-save-img">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Lưu ảnh
    </button>
    <button class="btn-action btn-copy-info" id="btn-copy-info">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy tóm tắt
    </button>
  </div>


  <div id="toast" class="toast"></div>

    function formatVNDate(dStr) {
      if (!dStr) return '';
      if (dStr.includes('Thứ') || dStr.includes('Chủ Nhật')) return dStr;
      const parts = dStr.split(/[\/\-]/);
      if (parts.length === 3) {
        const d = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10) - 1;
        const y = parseInt(parts[2], 10);
        const dt = new Date(y, m, d);
        if (!isNaN(dt.getTime())) {
          const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
          return days[dt.getDay()] + ', ' + dStr;
        }
      }
      return dStr;
    }

    const isPreview = window.self !== window.top || window.location.search.includes('preview=1');

      document.body.classList.add('in-preview');

    // Parse Data from URL Hash
    function parseTicketData() {
      try {
        let hash = window.location.hash ? window.location.hash.slice(1) : '';
        if (!hash) {
          const params = new URLSearchParams(window.location.search);
          hash = params.get('d') || '';
        }
        if (!hash) return null;

        // 1. Compact format (v3 or v2: PNR|Airline|Color|Gradient|Flights|Passengers)
        if (hash.startsWith('v3:') || hash.startsWith('v2:')) {
          const raw = decodeURIComponent(hash.slice(3));
          const parts = raw.split('|');
          const pnr = parts[0] || '';

          const REV_AIRLINE_MAP = {
            'VJ': 'Vietjet Air',
            'VN': 'Vietnam Airlines',
            'QH': 'Bamboo Airways',
            'BL': 'Pacific Airlines',
            'VU': 'Vietravel Airlines'
          };
          const airline = REV_AIRLINE_MAP[parts[1]] || parts[1] || 'VIETJET AIR';
          const color = parts[2] || '#F5A623';
          const useGradient = parts[3] === '1';
          const flightsStr = parts[4] || '';
          const passengersStr = parts[5] || '';

          const REV_CLASS_MAP = {
            'DLX': 'Deluxe',
            'ECO': 'ECO',
            'SB': 'SkyBoss',
            'BUS': 'Business'
          };

          const flights = flightsStr ? flightsStr.split(';').map(fStr => {
            const f = fStr.split(',');
            const rawClass = f[9] || 'ECO';
            const ticketClass = REV_CLASS_MAP[rawClass] || rawClass;
            return {
              flightNum: f[0] || '',
              depCode: f[1] || '',
              arrCode: f[2] || '',
              depTime: f[3] || '',
              depDate: formatVNDate(f[4] || ''),
              arrTime: f[5] || '',
              arrDate: formatVNDate(f[6] || f[4] || ''),
              carryOn: f[7] || '07kg',
              baggage: f[8] || '',
              ticketClass: ticketClass
            };
          }) : [];

          const passengers = passengersStr ? passengersStr.split(';').map(pStr => {
            const p = pStr.split(',');
            let tk = p[3] || '';
            if (tk && !tk.includes(pnr) && /^\d+-\d+$/.test(tk)) {
              tk = pnr + '-' + tk;
            }
            const srvStr = p[4] || '';
            const services = srvStr ? srvStr.split('^').map(sItem => {
              const sParts = sItem.split('~');
              let type = 'Dịch vụ khác';
              const tc = sParts[0];
              if (tc === 's') type = 'Chỗ ngồi';
              else if (tc === 'b') type = 'Hành lý';
              else if (tc === 'm') type = 'Suất ăn';
              else if (tc && tc.length > 1) type = tc.replace(/[:\s]+$/, '').trim();

              return {
                type: type,
                name: (sParts[1] || '').trim(),
                route: (sParts[2] || '').trim()
              };
            }).filter(s => s.name) : [];

            return {
              name: p[0] || '',
              gender: p[1] || '',
              type: p[2] || 'Người lớn',
              ticketNum: tk,
              services: services
            };
          }) : [];

          return {
            pnr,
            airline,
            color,
            useGradient,
            flights,
            passengers
          };
        }

        // 2. Fallback: LZString decompression
        if (typeof LZString !== 'undefined') {
          const decomp = LZString.decompressFromEncodedURIComponent(hash);
          if (decomp) return JSON.parse(decomp);
        }

        // 3. Fallback: Direct JSON
        return JSON.parse(decodeURIComponent(hash));
      } catch (e) {
        console.warn('Decode hash failed:', e);
      }
      return null;
    }

      // Darker shade
      const h = data.color.replace('#', '');
      const r = Math.max(0, parseInt(h.slice(0,2),16) - 35);
      const g = Math.max(0, parseInt(h.slice(2,4),16) - 35);
      const b = Math.max(0, parseInt(h.slice(4,6),16) - 35);
      const darkHex = '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('');
      document.documentElement.style.setProperty('--sp-dark', darkHex);
    }

    if (data.useGradient) {
      document.documentElement.style.setProperty('--flight-header-bg', 'linear-gradient(135deg, var(--sp) 0%, var(--sp-dark) 100%)');
    } else {
      document.documentElement.style.setProperty('--flight-header-bg', 'var(--sp)');
    }

    // Airline Logo Resolver (LocalStorage from uploaded ticket or crisp vector SVG)
    // Populate Brand & PNR
    document.getElementById('ticket-logo').src = LOGO_BASE64;
    document.getElementById('airline-name').textContent = data.airline || 'VIETJET AIR';
    document.getElementById('pnr-code').textContent = data.pnr || 'SAQ68D';

    function extractKg(str) {
      if (!str) return null;
      const m = str.match(/(\d+)\s*k/i);
      return m ? parseInt(m[1], 10) : null;
    }

    // Populate Flights
    const flCont = document.getElementById('flights-container');
    flCont.innerHTML = '';
    (data.flights || []).forEach(f => {
      const flightRouteClean = ((f.depCode || '') + (f.arrCode || '')).replace(/[^A-Z0-9]/gi, '').toUpperCase();
      const fKg = extractKg(f.baggage);
      const extraBags = [];
      (data.passengers || []).forEach(p => {
        (p.services || []).forEach(s => {
          const isBag = (s.type && s.type.toLowerCase().includes('hành lý')) || (s.name && /bag|\d+\s*kg/i.test(s.name));
          const sRouteClean = (s.route || '').replace(/[^A-Z0-9]/gi, '').toUpperCase();
          const routeMatch = sRouteClean ? (sRouteClean === flightRouteClean) : (data.flights.length === 1);
          if (isBag && routeMatch) {
            const sKg = extractKg(s.name);
            const isDuplicate = fKg !== null && sKg !== null && fKg === sKg;
            if (!isDuplicate) {
              extraBags.push(s.name + (data.passengers.length > 1 ? ' (' + p.name.split(' ').pop() + ')' : ''));
            }
          }
        });
      });
      let baggageHtml = '';
      if (f.baggage && extraBags.length > 0) {
        baggageHtml = `<span>Ký gửi: <strong>${f.baggage} + ${extraBags.join(', ')}</strong></span>`;
      } else if (f.baggage) {
        baggageHtml = `<span>Ký gửi: <strong>${f.baggage}</strong></span>`;
      } else if (extraBags.length > 0) {
        baggageHtml = `<span>Ký gửi: <strong>${extraBags.join(', ')}</strong></span>`;
      } else {
        baggageHtml = '<span style="color:#94A3B8;">Ký gửi: Không có</span>';
      }

      const card = document.createElement('div');
      card.className = 'flight-card';
      card.innerHTML = `
        <div class="flight-card__header">
          <span>${f.title || (f.depCode + ' ✈ ' + f.arrCode)}</span>
          <span>${f.flightNum || ''}</span>
        </div>
        <div class="flight-card__meta">
          <div class="meta-row">
            <span>Hãng: <strong>${f.carrier || data.airline || ''}</strong></span>
            <span>Hạng: <strong>${f.ticketClass || 'ECO'}</strong></span>
          </div>
          <div class="meta-row baggage-row">
            <span>Xách tay: <strong>${f.carryOn || '07kg'}</strong></span>
            ${baggageHtml}
          </div>
        </div>
        <div class="flight-route-grid">
          <div class="route-node origin">
            <div class="route-date">${f.depDate || ''}</div>
            <div class="route-time">${f.depTime || ''}</div>
            <div class="route-code">${f.depCode || ''}</div>
            ${f.depCity ? '<div class="route-city">' + f.depCity + '</div>' : ''}
            ${f.depAirport ? '<div class="route-airport">' + f.depAirport + '</div>' : ''}
            ${f.depTerminal ? '<div class="route-terminal">' + f.depTerminal + '</div>' : ''}
          </div>
          <div class="route-mid">
            <span class="route-plane-icon">✈</span>
            <span class="route-dur">${f.duration || ''}</span>
          </div>
          <div class="route-node dest">
            <div class="route-date">${f.arrDate || ''}</div>
            <div class="route-time">${f.arrTime || ''}</div>
            <div class="route-code">${f.arrCode || ''}</div>
            ${f.arrCity ? '<div class="route-city">' + f.arrCity + '</div>' : ''}
            ${f.arrAirport ? '<div class="route-airport">' + f.arrAirport + '</div>' : ''}
            ${f.arrTerminal ? '<div class="route-terminal">' + f.arrTerminal + '</div>' : ''}
          </div>
        </div>
        ${f.aircraft ? '<div style="padding:6px 14px 10px;font-size:10px;color:#64748B;background:#FFF;border-top:1px dashed #F1F5F9;">Máy bay: <strong>' + f.aircraft + '</strong></div>' : ''}
      `;
      flCont.appendChild(card);
    });

    // Populate Passengers
    const psCont = document.getElementById('passengers-container');
    psCont.innerHTML = '';
    if (data.passengers && data.passengers.length > 0) {
      const pCard = document.createElement('div');
      pCard.className = 'passenger-card';
      let html = '<div class="passenger-card__header">Thông tin hành khách</div>';
      data.passengers.forEach((p, idx) => {
        const tag = (p.type || '') + (p.type && p.gender ? ' / ' : '') + (p.gender || '');
        html += `
          <div class="passenger-item">
            <div class="passenger-main">
              <span class="passenger-name">${idx+1}. ${p.name}</span>
              ${tag ? '<span class="passenger-tag">' + tag + '</span>' : ''}
            </div>
            ${p.ticketNum ? '<div class="passenger-sub"><span>Vé/Receipt:</span><span class="passenger-ticket-no">' + p.ticketNum + '</span></div>' : ''}
            ${(() => {
              // Deduplicate baggage that is already included in flight allowance
              const pServices = (p.services || []).filter(s => {
                const isBag = (s.type && s.type.toLowerCase().includes('hành lý')) || (s.name && /bag|\d+\s*kg/i.test(s.name));
                if (!isBag) return true;
                const sRouteClean = (s.route || '').replace(/[^A-Z0-9]/gi, '').toUpperCase();
                const sKg = extractKg(s.name);
                const matchingFlight = (data.flights || []).find(f => {
                  const fRouteClean = ((f.depCode || '') + (f.arrCode || '')).replace(/[^A-Z0-9]/gi, '').toUpperCase();
                  return sRouteClean ? (sRouteClean === fRouteClean) : (data.flights.length === 1);
                });
                if (matchingFlight) {
                  const fKg = extractKg(matchingFlight.baggage);
                  if (fKg !== null && sKg !== null && fKg === sKg) {
                    return false; // Skip duplicate baggage already presented in flight card
                  }
                }
                return true;
              });

              if (pServices.length === 0) return '';
              
              function serviceSortWeight(s) {
                const isSeat = (s.type && s.type.toLowerCase().includes('ngồi')) || /^[0-9]{1,2}[A-Z]$/i.test(s.name);
                if (isSeat) return 1;
                const isBag = (s.type && s.type.toLowerCase().includes('hành lý')) || /bag|\d+\s*kg/i.test(s.name);
                if (isBag) return 2;
                const isMeal = (s.type && s.type.toLowerCase().includes('suất ăn')) || /meal|ăn|cơm/i.test(s.name);
                if (isMeal) return 3;
                return 4;
              }

              if (pServices.length <= 1) {
                return `
                  <div class="passenger-services">
                    ${pServices.map(s => {
                      const sType = (s.type || 'Dịch vụ').replace(/[:\s]+$/, '').trim();
                      const sRoute = s.route ? ` <span class="service-route">(${s.route})</span>` : '';
                      return `
                        <div class="passenger-service-row">
                          <span>${sType}:</span>
                          <span class="passenger-service-desc"><strong>${s.name}</strong>${sRoute}</span>
                        </div>
                      `;
                    }).join('')}
                  </div>
                `;
              }

              const byRoute = {};
              pServices.forEach(s => {
                const r = s.route ? s.route.trim() : 'Dịch vụ';
                if (!byRoute[r]) byRoute[r] = [];
                byRoute[r].push(s);
              });

              return `
                <div class="passenger-services">
                  ${Object.entries(byRoute).map(([route, items]) => {
                    items.sort((a, b) => serviceSortWeight(a) - serviceSortWeight(b));
                    const itemsHtml = items.map(s => {
                      const isSeat = (s.type && s.type.toLowerCase().includes('ngồi')) || /^[0-9]{1,2}[A-Z]$/i.test(s.name);
                      const prefix = isSeat ? 'Ghế ' : '';
                      return `<strong>${prefix}${s.name}</strong>`;
                    }).join(' • ');
                    const label = route === 'Dịch vụ' ? 'Dịch vụ:' : `${route}:`;
                    return `
                      <div class="passenger-service-row">
                        <span>${label}</span>
                        <span class="passenger-service-desc">${itemsHtml}</span>
                      </div>
                    `;
                  }).join('')}
                </div>
              `;
            })()}
          </div>
        `;
      });
      pCard.innerHTML = html;
      psCont.appendChild(pCard);
    }
  }

    async function init() {
      const urlParams = new URLSearchParams(window.location.search);
      let pnrParam = urlParams.get('pnr');

      // Also detect clean short path like /KBSYWF directly from window.location.pathname!
      if (!pnrParam) {
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        if (pathSegments.length === 1 && /^[A-Za-z0-9_-]{5,8}$/.test(pathSegments[0])) {
          pnrParam = pathSegments[0];
        }
      }

      if (pnrParam) {
        const cleanPnr = pnrParam.trim().toUpperCase();
        const pnrCodeEl = document.getElementById('pnr-code');
        if (pnrCodeEl) pnrCodeEl.textContent = cleanPnr;
        const flCont = document.getElementById('flights-container');
        if (flCont) {
          flCont.innerHTML = '<div style="text-align:center;padding:50px 20px;color:#64748B;"><div style="font-size:32px;display:inline-block;animation:etkt-spin 1.2s linear infinite;">✈️</div><p style="margin-top:12px;font-weight:600;font-size:14px;color:#1E293B;">Đang tải vé điện tử [' + cleanPnr + ']...</p></div>';
        }
        try {
          const res = await fetch('/api/ticket?pnr=' + encodeURIComponent(cleanPnr));
          if (res.ok) {
            const json = await res.json();
            if (json.success && json.ticketData) {
              renderTicket(json.ticketData);
              return;
            }
          }
          if (flCont) {
            flCont.innerHTML = '<div style="text-align:center;padding:35px 20px;color:#B91C1C;background:#FEF2F2;border:1px dashed #FCA5A5;border-radius:14px;margin:15px;"><div style="font-size:32px;">⚠️</div><p style="margin-top:10px;font-weight:700;font-size:15px;">Chưa tìm thấy vé [' + cleanPnr + ']</p><p style="margin-top:6px;font-size:12px;color:#64748B;line-height:1.5;">Booking có thể chưa được lưu lên hệ thống hoặc đường dẫn không đúng.<br>Vui lòng liên hệ Simple Travel qua <strong>Hotline: 0768.188.224</strong></p></div>';
          }
          return;
        } catch (err) {
          console.warn('Fetch ticket error:', err);
        }
      }

      const rawData = parseTicketData() || SAMPLE_DATA;
      renderTicket(rawData);
    }

    init();


    // Zalo Notice Banner Handling
    const isZalo = /zalo/i.test(navigator.userAgent);
    const zaloNoticeBanner = document.getElementById('zalo-notice-banner');
    if (isZalo && zaloNoticeBanner) {
      zaloNoticeBanner.style.display = 'flex';
      // Swap bottom bar buttons for Zalo
      const btnSave = document.getElementById('btn-save-img');
      if (btnSave) {
        btnSave.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> Mở trình duyệt';
      }
      const btnCopy = document.getElementById('btn-copy-info');
      if (btnCopy) {
        btnCopy.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy tóm tắt';
      }
    }

    function copyTicketLink(btnEl) {
      const urlToCopy = window.location.href;
      const onCopied = () => {
        if (btnEl) {
          const prevText = btnEl.innerHTML;
          btnEl.innerHTML = '✅ Đã copy!';
          btnEl.style.background = '#10B981';
          btnEl.style.borderColor = '#10B981';
          btnEl.style.color = '#FFFFFF';
          setTimeout(() => {
            btnEl.innerHTML = prevText;
            btnEl.style.background = '';
            btnEl.style.borderColor = '';
            btnEl.style.color = '';
          }, 3500);
        }
        showToast('🔗 Đã copy link vé! Mở Safari / Chrome để lưu vào Album.');
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(urlToCopy).then(onCopied).catch(() => {
          fallbackCopy(urlToCopy, onCopied);
        });
      } else {
        fallbackCopy(urlToCopy, onCopied);
      }
    }

    function fallbackCopy(text, cb) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(ta);
      if (cb) cb();
    }

    // Action: Save Image (Zalo, Safari, Mobile & Desktop optimized)
    document.getElementById('btn-save-img').addEventListener('click', async () => {
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || ('ontouchstart' in window);
      const isZalo = /zalo/i.test(navigator.userAgent);

      // 1. In Zalo In-App Browser:
      // Show notice banner on top, copy link & provide instant feedback without popup/download error
      if (isZalo) {
        if (zaloNoticeBanner) {
          zaloNoticeBanner.style.display = 'flex';
          zaloNoticeBanner.scrollIntoView({ behavior: 'smooth', block: 'start' });
          zaloNoticeBanner.classList.add('banner-pulse');
          setTimeout(() => zaloNoticeBanner.classList.remove('banner-pulse'), 1500);
        }
        const btnSave = document.getElementById('btn-save-img');
        const prevText = btnSave.innerHTML;
        btnSave.innerHTML = '✅ ĐÃ COPY LINK VÉ!';
        btnSave.style.background = '#10B981';
        setTimeout(() => {
          btnSave.innerHTML = prevText;
          btnSave.style.background = '';
        }, 3500);
        copyTicketLink(null);
        showToast('👉 Bấm [ ••• ] góc trên Zalo ➔ Mở bằng trình duyệt (Safari/Chrome)');
        return;
      }

      showToast('⏳ Đang tạo ảnh độ nét cao...');
      try {
        const card = document.getElementById('ticket-card') || document.getElementById('ticketCard');
        const prevWidth = card.style.width;
        card.style.width = '420px';
        const canvas = await html2canvas(card, {
          scale: 2.5,
          useCORS: true,
          allowTaint: true,
          backgroundColor: '#FFFFFF'
        });
        card.style.width = prevWidth;

        const filename = 'eticket_mobile_' + (data.pnr || 'ticket') + '.png';
        const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));

        // 2. On Mobile (Safari, Chrome): Use Web Share API so it can be saved directly to Photos
        if (isMobile && navigator.share && navigator.canShare && blob) {
          try {
            const file = new File([blob], filename, { type: 'image/png' });
            if (navigator.canShare({ files: [file] })) {
              await navigator.share({
                files: [file],
                title: 'Vé điện tử ' + (data.pnr || '')
              });
              showToast('✅ Đã mở bảng lưu ảnh');
              return;
            }
          } catch (shareErr) {
            if (shareErr.name === 'AbortError') return; // User cancelled share sheet
            console.warn('Web Share failed:', shareErr);
          }
        }

        // 3. Fallback / Desktop: Direct browser blob download
        const objUrl = blob ? URL.createObjectURL(blob) : canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = objUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        if (blob) setTimeout(() => URL.revokeObjectURL(objUrl), 15000);
        showToast('✅ Đã tải ảnh vé về máy!');
      } catch (err) {
        console.error(err);
        showToast('❌ Lỗi tạo ảnh: ' + err.message);
      }
    });

    // Action: Copy text
    document.getElementById('btn-copy-info').addEventListener('click', () => {
      let txt = '✈️ VÉ ĐIỆN TỬ - SIMPLE TRAVEL\n';
      txt += 'Mã đặt chỗ: ' + (data.pnr || '') + '\n';
      txt += 'Hãng: ' + (data.airline || '') + '\n\n';
      (data.flights || []).forEach(f => {
        txt += '🛫 ' + (f.depDate || '') + '\n';
        txt += '   ' + (f.flightNum || '') + ' ' + (f.depCode || '') + ' - ' + (f.arrCode || '') + ' ' + (f.depTime || '') + ' ' + (f.arrTime || '');
        if (f.arrDate && f.depDate && f.arrDate !== f.depDate) {
          txt += ' (+1 ngày: ' + f.arrDate + ')';
        }
        txt += '\n\n';
      });
      txt += 'Khách bay:\n';
      (data.passengers || []).forEach((p, idx) => {
        const tag = (p.type || '') + (p.type && p.gender ? ' / ' : '') + (p.gender || '');
        txt += (idx + 1) + '. ' + p.name + (tag ? ' (' + tag + ')' : '') + '\n';
      });

      navigator.clipboard.writeText(txt.trim()).then(() => {
        showToast('📋 Đã sao chép tóm tắt vé!');
      }).catch(() => {
        showToast('⚠️ Không sao chép được');
      });
    });
  </script>
</body>
